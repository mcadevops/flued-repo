name: Flued DevOps CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t flued-backend:${{ github.sha }} \
            ./app

      - name: Test Docker image
        run: |
          docker run -d \
            --name flued-test \
            -p 5000:5000 \
            flued-backend:${{ github.sha }}

          sleep 5

          curl -f http://localhost:5000/health

          docker stop flued-test
          docker rm flued-test

      - name: Deployment information
        run: |
          echo "Docker build successful"
          echo "Commit: ${{ github.sha }}"
          echo "Ready for Kubernetes deployment"

