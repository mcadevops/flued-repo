name: Flued DevOps CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # CI - Build & Test
      # -------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t flued-backend:${{ github.sha }} \
            ./app

      - name: Test Docker image
        run: |
          docker run -d \
            --name flued-test \
            -p 5000:5000 \
            flued-backend:${{ github.sha }}

          sleep 5

          curl -f http://localhost:5000/health

          docker stop flued-test
          docker rm flued-test

      # -------------------------
      # CD - Deploy to EC2/Kind
      # -------------------------

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Kubernetes
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          cd ~/flued-devops-challenge

          echo "Building Docker image on EC2..."

          docker build \
            -t flued-backend:${{ github.sha }} \
            ./app

          echo "Loading image into Kind..."

          kind load docker-image \
            flued-backend:${{ github.sha }} \
            --name flued-challenge

          echo "Updating Kubernetes deployment..."

          kubectl set image deployment/flued-backend \
            backend=flued-backend:${{ github.sha }}

          echo "Waiting for rollout..."

          kubectl rollout status \
            deployment/flued-backend \
            --timeout=120s

          echo "Deployment successful!"

          kubectl get pods

          EOF
