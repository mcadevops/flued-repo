apiVersion: apps/v1
kind: Deployment
metadata:
  name: flued-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flued-backend
  template:
    metadata:
      labels:
        app: flued-backend
    spec:
      containers:
        - name: backend
          image: flued-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: demo
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: password123

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: flued-backend
spec:
  type: NodePort
  selector:
    app: flued-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
